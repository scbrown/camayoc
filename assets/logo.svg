<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">camayoc</title>
  <desc id="desc">A quipu whose loose, unknotted strands on the left pass through the keeper's golden binding knot on the main cord and emerge on the right as ordered, colored, knotted pendant strings — raw thread becoming governed record.</desc>
  <defs>
    <!-- Main cord, matching the quipu logo -->
    <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5E3C"/>
      <stop offset="50%" style="stop-color:#A0714F"/>
      <stop offset="100%" style="stop-color:#8B5E3C"/>
    </linearGradient>
    <!-- Loose, ungoverned fiber: muted gray -->
    <linearGradient id="loose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6E7286"/>
      <stop offset="100%" style="stop-color:#4E5265"/>
    </linearGradient>
    <!-- The keeper's binding: gold -->
    <linearGradient id="keeper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F2CC8F"/>
      <stop offset="100%" style="stop-color:#D4A95A"/>
    </linearGradient>
    <!-- Governed pendant strings: the family palette -->
    <linearGradient id="str1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E07A5F"/>
      <stop offset="100%" style="stop-color:#C45B3C"/>
    </linearGradient>
    <linearGradient id="str2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3D85C6"/>
      <stop offset="100%" style="stop-color:#2A6BAD"/>
    </linearGradient>
    <linearGradient id="str3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81B29A"/>
      <stop offset="100%" style="stop-color:#5E9B7E"/>
    </linearGradient>
    <linearGradient id="str4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B72AA"/>
      <stop offset="100%" style="stop-color:#7D5691"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Background disc, matching quipu / bobbin / shantytown -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#2d2d4a" stroke-width="1.5"/>

  <!-- Main horizontal cord -->
  <path d="M 66 148 Q 256 124 446 148" stroke="url(#cordGrad)" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 66 148 Q 256 124 446 148" stroke="#725039" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="8 12" opacity="0.5"/>

  <!-- LEFT: loose, unknotted fiber drifting in — no knots, tangled, gray -->
  <path d="M 100 146 Q 84 200 108 236 Q 130 268 100 300 Q 78 334 104 372"
        stroke="url(#loose)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M 138 142 Q 158 190 132 228 Q 108 264 142 296 Q 168 326 140 366 Q 128 386 146 404"
        stroke="url(#loose)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M 176 138 Q 164 184 188 216 Q 210 246 180 282 Q 158 314 186 348"
        stroke="url(#loose)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- frayed ends -->
  <path d="M 104 372 l -8 14 M 104 372 l 4 16" stroke="#4E5265" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 146 404 l -7 12 M 146 404 l 6 13" stroke="#4E5265" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 186 348 l -8 13 M 186 348 l 5 15" stroke="#4E5265" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- CENTER: the keeper's binding — a golden knot gathered around the main cord -->
  <g filter="url(#shadow)">
    <!-- the loop over the cord -->
    <path d="M 238 118 Q 256 104 274 118 Q 288 130 280 146 Q 272 160 256 160 Q 240 160 232 146 Q 224 130 238 118 Z"
          fill="none" stroke="url(#keeper)" stroke-width="7" stroke-linecap="round"/>
    <!-- the binding wraps -->
    <path d="M 240 152 Q 256 166 272 152" stroke="url(#keeper)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 243 162 Q 256 174 269 162" stroke="url(#keeper)" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M 246 172 Q 256 181 266 172" stroke="url(#keeper)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- the keeper's knot itself -->
    <ellipse cx="256" cy="192" rx="11" ry="8" fill="#F2CC8F" stroke="#D4A95A" stroke-width="2"/>
    <ellipse cx="256" cy="192" rx="5" ry="3.5" fill="none" stroke="#B8904A" stroke-width="1.5" opacity="0.8"/>
  </g>
  <!-- the certified tail dropping from the keeper's knot -->
  <path d="M 256 200 Q 252 240 258 276 Q 263 306 256 336"
        stroke="url(#keeper)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="257" cy="276" rx="7" ry="5" fill="#F2CC8F" stroke="#D4A95A" stroke-width="1.5"/>

  <!-- RIGHT: governed pendants — ordered, colored, knotted -->
  <!-- terracotta, 2 knots -->
  <path d="M 306 132 Q 300 200 310 258 Q 316 300 306 356 Q 302 384 308 412"
        stroke="url(#str1)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="306" cy="212" rx="7" ry="5" fill="#E07A5F" stroke="#C45B3C" stroke-width="1.5"/>
  <ellipse cx="308" cy="330" rx="7" ry="5" fill="#E07A5F" stroke="#C45B3C" stroke-width="1.5"/>
  <!-- blue, 3 knots, longest -->
  <path d="M 350 130 Q 344 190 354 244 Q 362 292 352 344 Q 346 388 354 428"
        stroke="url(#str2)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="350" cy="188" rx="7" ry="5" fill="#3D85C6" stroke="#2A6BAD" stroke-width="1.5"/>
  <ellipse cx="355" cy="282" rx="7" ry="5" fill="#3D85C6" stroke="#2A6BAD" stroke-width="1.5"/>
  <ellipse cx="352" cy="376" rx="7" ry="5" fill="#3D85C6" stroke="#2A6BAD" stroke-width="1.5"/>
  <!-- sage, 2 knots -->
  <path d="M 394 132 Q 390 186 398 234 Q 404 276 396 322 Q 390 358 396 392"
        stroke="url(#str3)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="396" cy="206" rx="7" ry="5" fill="#81B29A" stroke="#5E9B7E" stroke-width="1.5"/>
  <ellipse cx="397" cy="304" rx="7" ry="5" fill="#81B29A" stroke="#5E9B7E" stroke-width="1.5"/>
  <!-- purple, 1 knot, shortest -->
  <path d="M 434 138 Q 430 182 436 222 Q 441 256 434 292 Q 430 318 434 344"
        stroke="url(#str4)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="435" cy="246" rx="7" ry="5" fill="#9B72AA" stroke="#7D5691" stroke-width="1.5"/>
</svg>
