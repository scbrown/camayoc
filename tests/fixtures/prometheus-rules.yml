groups:
  - name: catalogue-test
    rules:
      - alert: ExampleLatencyHigh
        # Deliberately invalid positive arm for Q4: this expression is always
        # true and therefore cannot distinguish a violated latency requirement.
        expr: vector(1) > 0
        for: 5m
        labels:
          severity: warning
          keeper: test-owner
          service: example
        annotations:
          description: Deliberately invalid probe that cannot measure the latency requirement it names.
