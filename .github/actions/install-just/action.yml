name: Install just (pinned, sha256-verified)
description: >
  Installs a pinned `just` release asset after checking it against a pinned
  sha256. Replaces `apt-get install just || curl .../install.sh | sudo bash`,
  whose fallback piped a remote script into root with no pin or checksum, and
  whose apt path gave whatever version the runner image happened to carry.
  Bump version and digest together; the digest equals the one GitHub records
  for the release asset.
inputs:
  version:
    default: "1.58.0"
  sha256:
    default: "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        JUST_VERSION: ${{ inputs.version }}
        JUST_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        asset="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
          "https://github.com/casey/just/releases/download/${JUST_VERSION}/$asset"
        echo "${JUST_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/just"
        tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/just" just
        echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/just/just" --version
